<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PegaFrete Admin | Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { light: '#f8fafc', DEFAULT: '#0f172a', blue: '#1e40af', accent: '#3b82f6' }
          }
        }
      }
    }
  </script>
  
  <style>
    .toast {
      position: fixed; top: 24px; right: 24px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform: translateY(-20px); opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen relative overflow-hidden font-sans">
  
  <!-- Decorative background elements -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-100 blur-[100px] opacity-60"></div>
    <div class="absolute bottom-[0%] -right-[10%] w-[40%] h-[60%] rounded-full bg-orange-50 blur-[120px] opacity-70"></div>
  </div>

  <div id="toast" class="toast"></div>

  <div class="w-full max-w-md px-6 z-10">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white border border-slate-200 rounded-2xl text-brand-blue shadow-sm mb-4">
        <i class="ph-fill ph-shield-checkered text-4xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-brand tracking-tight">Pega<span class="text-brand-blue">Frete</span></h1>
      <p class="text-xs font-bold text-slate-400 tracking-[0.2em] mt-2 uppercase">Painel Administrativo</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
      <h2 class="text-xl font-bold text-slate-800 mb-2">Acesso Restrito</h2>
      <p class="text-sm text-slate-500 mb-6">Entre com suas credenciais para gerenciar o sistema.</p>
      
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5 flex items-center gap-2">
            <i class="ph ph-envelope text-brand-blue"></i> E-mail
          </label>
          <input type="email" id="email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all text-sm" placeholder="admin@pegafrete.com.br" required autocomplete="email">
        </div>
        
        <div class="relative">
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5 flex items-center gap-2">
            <i class="ph ph-lock text-brand-blue"></i> Senha
          </label>
          <input type="password" id="password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none transition-all text-sm" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="absolute right-3 bottom-3 text-slate-400 hover:text-brand-blue focus:outline-none" onclick="togglePass()">
            <i class="ph ph-eye text-xl" id="toggleIcon"></i>
          </button>
        </div>
        
        <button type="submit" id="btnLogin" class="w-full bg-brand text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 mt-4 hover:bg-slate-800 transition-colors shadow-md shadow-slate-200">
          Entrar no Painel <i class="ph ph-sign-in text-lg"></i>
        </button>

        <div class="relative my-6 flex items-center justify-center">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <span class="relative bg-white px-3 text-xs text-slate-400 font-semibold uppercase">Ou acesse com</span>
        </div>

        <button type="button" id="btnGoogle" onclick="loginComGoogle()" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-sm text-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.9h6.69c-.29 1.5-.1.14 1.14 2.37l3.9-3.03c2.28-2.1 3.57-5.17 3.57-8.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-3.9-3.03c-1.08.72-2.47 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96l-4.03 3.12C3.21 21.09 7.29 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.26c-.25-.72-.39-1.5-.39-2.26s.14-1.54.39-2.26L1.24 6.62C.44 8.23 0 10.06 0 12s.44 3.77 1.24 5.38l4.03-3.12z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.43-3.43C17.96 1.19 15.24 0 12 0 7.29 0 3.21 2.91 1.24 6.62l4.03 3.12c.95-2.85 3.6-4.99 6.73-4.99z"/>
          </svg>
          Entrar com Google
        </button>
      </form>
      
      <div class="mt-6 flex items-start gap-3 bg-orange-50 border border-orange-100 p-4 rounded-xl">
        <i class="ph-fill ph-warning-circle text-orange-500 text-xl shrink-0 mt-0.5"></i>
        <p class="text-[11px] text-orange-800 leading-relaxed font-medium">Este sistema monitora acessos. Tentativas não autorizadas serão rigorosamente registradas para auditoria (Zero Trust Policy).</p>
      </div>
    </div>
    
    <div class="text-center mt-8 text-xs font-semibold text-slate-400">
      &copy; 2026 PegaFrete Logística.
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
